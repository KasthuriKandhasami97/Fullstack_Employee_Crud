<div class="container mt-4">

  <h4 class="fw-bold my-2">

    <i class="bi bi-person-plus-fill me-2"></i>

    {{
    selectedEmployee?._id
    ? 'Update Employee'
    : 'Add Employee'
    }}

  </h4>

  <!-- FORM -->
  <app-employee-form [employee]="selectedEmployee" (save)="saveEmployee($event)">
  </app-employee-form>

  <!-- TOP BAR -->
  <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center my-3">

    <div>

      <h3 class="mb-1 fw-bold">

        <i class="bi bi-people-fill me-2"></i>

        Employee List

      </h3>

      <p class="text-muted mb-0 mt-3">

        Total Employees:
        <strong>
          {{ filteredEmployees.length }}
        </strong>

      </p>

    </div>

    <div class="d-flex gap-2 flex-wrap">

      <!-- SEARCH -->
      <input type="text" class="form-control" placeholder="Search employee..." [(ngModel)]="searchText"
        (input)="filterEmployees()">

      <!-- STATUS -->
      <select class="form-select" [(ngModel)]="selectedStatus" (change)="filterEmployees()">

        <option value="">
          All Employees
        </option>

        <option value="Active">
          Active
        </option>

        <option value="Inactive">
          Inactive
        </option>

      </select>

    </div>

  </div>



       <!-- TABLE -->
  <div class="table-responsive">

    <table class="table table-hover table-bordered align-middle">

      <!-- TABLE HEADER -->
      <thead class="table-dark">

        <tr>

          <th>Name</th>

          <th>Email</th>

          <th>Status</th>

          <th width="250">
            Actions
          </th>

        </tr>

      </thead>

      <!-- TABLE BODY -->
      <tbody>

        <tr *ngFor="let emp of paginatedEmployees">

          <!-- NAME -->
          <td class="fw-semibold">{{ emp.name }}</td>
          <!-- EMAIL -->
          <td>{{ emp.email }}</td>
          <!-- STATUS -->
          <td> <span class="badge" [ngClass]="{
                                    'bg-success':
                                      emp.status === 'Active',

                                      'bg-danger':
                                      emp.status === 'Inactive'
                                      }">{{ emp.status }}
            </span>

          </td>
          <!-- ACTIONS -->
          <td>
            <div class="d-flex gap-2 flex-wrap">
              <!-- VIEW -->
              <button class="btn btn-primary btn-sm rounded-pill px-3" (click)="viewEmployee(emp._id)">
              <i class="bi bi-eye"></i>View</button>

              <!-- EDIT -->
              <button class="btn btn-success btn-sm rounded-pill px-3" (click)="edit(emp)">
                <i class="bi bi-pencil"></i>Edit</button>

              <!-- DELETE -->
              <button class="btn btn-danger btn-sm rounded-pill px-3" (click)="deleteEmployee(emp._id)">
                <i class="bi bi-trash"></i>Delete
              </button>
            </div>

          </td>

        </tr>
        <!-- NO DATA -->
  <tr *ngIf="paginatedEmployees.length === 0">

    <td
      colspan="4"
      class="text-center py-4 text-muted fw-semibold">

      <i class="bi bi-search fs-4 d-block mb-2"></i>

      No Employee Found

    </td>

  </tr>
  <tr *ngIf="employees.length === 0">

  <td
    colspan="4"
    class="text-center py-4 text-muted fw-semibold">

    <i class="bi bi-database-x fs-4 d-block mb-2"></i>

    No Data Found

  </td>

</tr>


      </tbody>

    </table>

  </div>


  <!-- PAGINATION -->
  <div class="d-flex justify-content-between align-items-center mt-3">

    <button class="btn btn-secondary" (click)="prevPage()" [disabled]="currentPage === 1">

      Previous

    </button>

    <span>

      Page {{ currentPage }}
      of {{ totalPages }}

    </span>

    <button class="btn btn-secondary" (click)="nextPage()" [disabled]="currentPage === totalPages">

      Next

    </button>

  </div>

</div>
