<div class="container mt-5">
  <h2>Login</h2>
  <input [(ngModel)]="loginData.email" placeholder="Email" class="form-control mb-2">
  <input [(ngModel)]="loginData.password" type="password" placeholder="Password" class="form-control mb-2">
  <button (click)="login()" class="btn btn-primary">Login</button>
</div>
