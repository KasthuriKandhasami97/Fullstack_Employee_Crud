<div class="container py-4">

  <!-- LOADING -->
  <div
    *ngIf="loading"
    class="text-center py-5"
  >

    <div
      class="spinner-border text-primary"
    ></div>

    <p class="mt-3">
      Loading Employee Details...
    </p>

  </div>

  <!-- DETAILS -->
  <div
    *ngIf="!loading && employee"
    class="card shadow border-0"
  >

    <!-- HEADER -->
    <div
      class="card-header bg-primary text-white d-flex justify-content-between align-items-center flex-wrap gap-2"
    >

      <h3 class="m-0">
        Employee Details
      </h3>

      <span
        class="badge fs-6"
        [ngClass]="{
          'bg-success':
            employee.status === 'Active',

          'bg-danger':
            employee.status === 'Inactive'
        }"
      >

        {{ employee.status }}

      </span>

    </div>

    <!-- BODY -->
    <div class="card-body">

      <div class="row g-4">

        <!-- NAME -->
        <div class="col-md-6">

          <h6 class="text-muted">
            Name
          </h6>

          <p class="fs-5 fw-semibold">
            {{ employee.name }}
          </p>

        </div>

        <!-- EMAIL -->
        <div class="col-md-6">

          <h6 class="text-muted">
            Email
          </h6>

          <p class="fs-5">
            {{ employee.email }}
          </p>

        </div>

        <!-- POSITION -->
        <div class="col-md-6">

          <h6 class="text-muted">
            Position
          </h6>

          <p class="fs-5">
            {{ employee.position }}
          </p>

        </div>

        <!-- DEPARTMENT -->
        <div class="col-md-6">

          <h6 class="text-muted">
            Department
          </h6>

          <p class="fs-5">
            {{ employee.department }}
          </p>

        </div>

        <!-- SALARY -->
        <div class="col-md-6">

          <h6 class="text-muted">
            Salary
          </h6>

          <p class="fs-5 text-success fw-bold">
            ₹ {{ employee.salary }}
          </p>

        </div>

        <!-- CREATED -->
        <div class="col-md-6">

          <h6 class="text-muted">
            Joined Date
          </h6>

          <p class="fs-5">
            {{
              employee.createdAt
              | date:'mediumDate'
            }}
          </p>

        </div>

      </div>

    </div>

    <!-- FOOTER -->
    <div
      class="card-footer bg-light d-flex gap-2 flex-wrap justify-content-end"
    >

      <!-- BACK -->
      <button
        class="btn btn-secondary"
        (click)="goBack()"
      >

        Back

      </button>

      <!-- PDF -->
      <button
        class="btn btn-danger"
        (click)="downloadPDF()"
      >

        Download PDF

      </button>

    </div>

  </div>

</div>
