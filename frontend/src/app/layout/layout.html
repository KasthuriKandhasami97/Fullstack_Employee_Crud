<div class="app-container">

   <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm fixed-top px-2 px-md-4">
    <div class="d-flex align-items-center w-100">

        <!-- LEFT -->
        <button class="btn btn-outline-primary me-2" (click)="toggleSidebar()">
        <i class="bi bi-list"></i>
        </button>

        <!-- TITLE -->
        <span class="d-md-none">EMS</span>
        <span class="d-none d-md-inline"> Employee Management System</span>
        <!-- RIGHT -->
        <div class="dropdown ms-auto">

        <button 
            class="btn d-flex align-items-center gap-1 gap-md-2"
            data-bs-toggle="dropdown">

            <i class="bi bi-person-circle fs-5 fs-md-4"></i>

            <!-- Hide text on small screens -->
            <span class="fw-semibold d-none d-md-inline">{{username}}</span>

            <i class="bi bi-chevron-down small"></i>
        </button>

       <ul class="dropdown-menu dropdown-menu-end">

    <li>
      <a class="dropdown-item" routerLink="/profile">
        <i class="bi bi-person"></i>
        My Profile
      </a>
    </li>

    <li><hr class="dropdown-divider"></li>

    <li>
      <a class="dropdown-item text-danger" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i>
        Logout
      </a>
    </li>

  </ul>

        </div>

    </div>

    </nav>

    <div class="layout-body">
          <!-- SIDEBAR -->
            <div class="sidebar p-3" [class.collapsed]="isCollapsed" [class.show]="isMobileOpen">

                <h4 class="text-white">
                <i class="bi bi-grid"></i>
                <span *ngIf="!isCollapsed"> Admin</span>
                </h4><hr>

                <ul class="nav flex-column mt-4">

                <li class="nav-item">
                    <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
                    <i class="bi bi-speedometer2"></i>
                    <span *ngIf="!isCollapsed"> Dashboard</span>
                    </a>
                </li>

                <li class="nav-item" *ngIf="user?.role === 'admin'">
                    <a routerLink="/employees" routerLinkActive="active" class="nav-link" (click)="isMobileOpen=false">
                    <i class="bi bi-people"></i>
                    <span *ngIf="!isCollapsed"> Employees</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a routerLink="/profile" routerLinkActive="active" class="nav-link">
                        <i class="bi bi-person-circle"></i>
                        <span *ngIf="!isCollapsed"> Profile</span>
                    </a>
                </li>

                </ul>
            </div>
             <!-- MAIN -->
            <div class="main-content w-100">
                <div class="p-4">
                <router-outlet></router-outlet>
                </div>
            </div>
    </div>
      <!-- FOOTER -->
  <footer class="footer text-center">
    © 2026 Employee Management System | All Rights Reserved
  </footer>

</div>
